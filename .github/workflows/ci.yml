name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean install
      - name: Upload NARs
        uses: actions/upload-artifact@v7
        with:
          name: nifi-llm-nars
          path: '*/target/*.nar'
          if-no-files-found: error
